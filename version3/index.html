<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="brand">SPLIT<span>•</span></div>
    <h1>💰 Bill Splitter</h1>
    <p class="subtitle">Split the bill easily. Enjoy the moment.</p>
    <label for="bill">Bill Amount (₹)</label>
    <input type="number" id="bill" placeholder="Enter bill amount" min="0">
    <label for="tip">Tip (₹)</label>
    <input type="number" id="tip" placeholder="Enter tip amount" min="0">
    <label for="people">Number of People</label>
    <input type="number" id="people" placeholder="Enter number of people" min="1">
    <div class="button-group">
        <button type="button" onclick="calculateBill()">Calculate</button>
        <button type="button" class="btn-reset" onclick="resetBill()">Reset</button>
    </div>
    <div class="result" id="result">
        <span>RESULT</span>
        <p>Total Bill: ₹0.00</p>
        <p>Each Person: ₹0.00</p>
    </div>
    <p class="tagline">Less math. More moments.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="script.js"></script>
</body>
</html>
